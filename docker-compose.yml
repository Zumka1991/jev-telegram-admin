services:
  jev-guard:
    build: .
    container_name: jev-telegram-guard
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    # SQLite не требует портов. Если перейдёте на Postgres — добавьте depends_on.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
